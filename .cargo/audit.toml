[advisories]
ignore = [
    # Marvin Attack in `rsa` crate - transitive dep via sqlx-mysql, which we don't use
    "RUSTSEC-2023-0071",
    # `IterMut` unsoundness in lru 0.12.5, pulled in via:
    #   memory -> lancedb 0.27.1 -> lance 3.0.1 -> tantivy 0.24.2 -> lru 0.12.5
    # The fix requires lru >= 0.13, which requires tantivy to release a new version.
    # tantivy main has the fix (uses lru 0.16.3) but it has not been tagged/released.
    # Track: re-check when tantivy 0.25+ is published and lance adopts it.
    # Refs: https://rustsec.org/advisories/RUSTSEC-2026-0002
    #       https://github.com/quickwit-oss/tantivy (main branch)
    "RUSTSEC-2026-0002",
    # rustls-webpki 0.101.7 CRL matching bug - transitive via lancedb 0.16 -> aws-smithy
    # -> hyper-rustls 0.24 -> tokio-rustls 0.24 -> rustls 0.21. Cannot update without
    # bumping lancedb past 0.16. Tracked in #543.
    "RUSTSEC-2026-0049",
    # Invalid pointer deref in crossbeam-epoch's fmt::Pointer impl. Transitive via:
    #   memory -> lancedb 0.27.1 -> lance 3.0.1 -> lance-index -> rayon -> crossbeam-epoch.
    # Only reached through the debug-formatting path we never exercise; fix requires an
    # upstream crossbeam-epoch release adopted by rayon. Re-check when rayon updates.
    "RUSTSEC-2026-0204",
    # Remote memory exhaustion in quinn-proto. Present in Cargo.lock only as reqwest's
    # OPTIONAL QUIC/HTTP3 dependency — it is not compiled: reqwest is built with
    # default-features=false + rustls-tls + json (no http3), so quinn-proto appears in
    # no built dependency tree (`cargo tree -i quinn-proto` is empty). No runtime exposure.
    "RUSTSEC-2026-0185",
    # DNS rebinding in rmcp's Streamable HTTP server transport. agentd-mcp uses the
    # stdio transport (see docs/planning/decisions/0001-agentd-mcp-stdio-transport.md),
    # not the HTTP server transport, so the vulnerable code path is not used.
    "RUSTSEC-2026-0189",
]
