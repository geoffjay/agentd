[advisories]
ignore = [
    # Marvin Attack in `rsa` crate - transitive dep via sqlx-mysql, which we don't use
    "RUSTSEC-2023-0071",
    # `IterMut` unsoundness in lru 0.12.5, pulled in via:
    #   memory -> lancedb 0.27.1 -> lance 3.0.1 -> tantivy 0.24.2 -> lru 0.12.5
    # The fix requires lru >= 0.13, which requires tantivy to release a new version.
    # tantivy main has the fix (uses lru 0.16.3) but it has not been tagged/released.
    # Track: re-check when tantivy 0.25+ is published and lance adopts it.
    # Refs: https://rustsec.org/advisories/RUSTSEC-2026-0002
    #       https://github.com/quickwit-oss/tantivy (main branch)
    "RUSTSEC-2026-0002",
    # rustls-webpki 0.101.7 CRL matching bug - transitive via lancedb 0.16 -> aws-smithy
    # -> hyper-rustls 0.24 -> tokio-rustls 0.24 -> rustls 0.21. Cannot update without
    # bumping lancedb past 0.16. Tracked in #543.
    "RUSTSEC-2026-0049",
]
