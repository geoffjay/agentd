# /etc/agentd/agentd.conf - agentd default configuration
#
# Environment variables shared by all agentd services.
# Per-service overrides can be set in systemd unit drop-ins:
#   systemctl edit agentd-<service>

# Log level (trace, debug, info, warn, error)
RUST_LOG=info

# Service ports
AGENTD_ASK_PORT=7001
AGENTD_HOOK_PORT=7002
AGENTD_MONITOR_PORT=7003
AGENTD_NOTIFY_PORT=7004
AGENTD_WRAP_PORT=7005
AGENTD_ORCHESTRATOR_PORT=7006
AGENTD_MEMORY_PORT=7008
AGENTD_UI_PORT=7009
AGENTD_COMMUNICATE_PORT=7010
AGENTD_INDEX_PORT=17012
AGENTD_CORE_PORT=7000

# Inter-service URLs
AGENTD_NOTIFY_SERVICE_URL=http://localhost:7004
AGENTD_ASK_SERVICE_URL=http://localhost:7001
AGENTD_ORCHESTRATOR_SERVICE_URL=http://localhost:7006

# UI assets directory
AGENTD_UI_DIR=/usr/share/agentd/ui
