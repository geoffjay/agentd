# Prometheus configuration for agentd local observability stack.
#
# Scrapes Prometheus /metrics endpoints from all agentd services that expose
# them. Services run on their default development ports (170xx).
#
# This file can be regenerated for different environments via:
#   ./generate-config.sh
#
# Usage:
#   prometheus --config.file=infra/prometheus/prometheus.yml
#
# Or via the launchd plist:
#   launchctl load ~/Library/LaunchAgents/com.agentd.prometheus.plist

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # Attach these labels to every time series and alert when communicating
  # with external systems.
  external_labels:
    env: 'dev'
    cluster: 'agentd-local'

# Alerting configuration (optional — add rules in a separate file)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['localhost:9093']

# Rule files (optional)
# rule_files:
#   - "alert_rules.yml"

scrape_configs:
  # Orchestrator — agent management, workflow scheduling, dispatch
  # Default port: 17006
  - job_name: 'agentd-orchestrator'
    static_configs:
      - targets: ['127.0.0.1:17006']
        labels:
          service: 'orchestrator'

  # Communicate — WebSocket rooms and real-time messaging
  # Default port: 17010
  - job_name: 'agentd-communicate'
    static_configs:
      - targets: ['127.0.0.1:17010']
        labels:
          service: 'communicate'

  # Notify — notification ingestion and delivery
  # Default port: 17004
  - job_name: 'agentd-notify'
    static_configs:
      - targets: ['127.0.0.1:17004']
        labels:
          service: 'notify'

  # Ask — approval requests and human-in-the-loop gates
  # Default port: 17001
  - job_name: 'agentd-ask'
    static_configs:
      - targets: ['127.0.0.1:17001']
        labels:
          service: 'ask'

  # Wrap — PTY session and tmux agent launcher
  # Default port: 17005
  - job_name: 'agentd-wrap'
    static_configs:
      - targets: ['127.0.0.1:17005']
        labels:
          service: 'wrap'

  # Memory — vector-backed knowledge store
  # Default port: 17008
  - job_name: 'agentd-memory'
    static_configs:
      - targets: ['127.0.0.1:17008']
        labels:
          service: 'memory'

  # Monitor — system monitoring and health checks
  # Default port: 17003
  - job_name: 'agentd-monitor'
    static_configs:
      - targets: ['127.0.0.1:17003']
        labels:
          service: 'monitor'
