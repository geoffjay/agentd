# Grafana dashboard provisioning — auto-loads all dashboards from the
# infra/grafana/dashboards directory on startup.
#
# Grafana provisioning path (Homebrew install):
#   /opt/homebrew/share/grafana/conf/provisioning/dashboards/
#
# NOTE: The `options.path` below must be an absolute path on the host
# where Grafana is running. The setup.sh script configures this automatically.

apiVersion: 1

providers:
  - name: agentd
    orgId: 1
    folder: 'agentd'
    folderUid: 'agentd'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # Absolute path — updated by infra/setup.sh at install time
      path: /Users/Shared/agentd/infra/grafana/dashboards
