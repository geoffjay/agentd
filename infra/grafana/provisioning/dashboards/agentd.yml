# Grafana dashboard provisioning template - auto-loads all dashboards
# from the installed dashboards directory on startup.
#
# This is a template - infra/setup.sh copies it to
# ~/Library/Application Support/agentd/grafana/provisioning/dashboards/agentd.yml
# with the placeholder path below resolved to its actual value.
#
# Do not edit the installed copy directly; edit this template and re-run setup.

apiVersion: 1

providers:
  - name: agentd
    orgId: 1
    folder: 'agentd'
    folderUid: 'agentd'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # Placeholder - resolved by infra/setup.sh at install time
      path: /Users/Shared/agentd/infra/grafana/dashboards
