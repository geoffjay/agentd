; Grafana configuration for agentd local observability stack.
;
; This file is referenced by infra/launchd/com.agentd.grafana.plist and
; overrides Grafana's default settings to point provisioning at the
; infra/grafana/provisioning directory.
;
; The setup.sh script updates the paths below automatically.
; Manual edits: replace /Users/Shared/agentd with your actual repo root.

[paths]
; Absolute path to the provisioning directory (datasources + dashboards)
provisioning = /Users/Shared/agentd/infra/grafana/provisioning

; Log directory
logs = /Users/Shared/agentd/logs

; SQLite database for Grafana state
data = /Users/Shared/agentd/grafana-data

[server]
; Default Grafana port — change if 3000 is in use
http_port = 3000
http_addr = 127.0.0.1

[security]
; Change admin_password before using in any non-local environment
admin_user = admin
admin_password = admin

[analytics]
reporting_enabled = false
check_for_updates = true

[log]
mode = file
level = info

[dashboards]
; Auto-reload provisioned dashboards when JSON files change
versions_to_keep = 20
