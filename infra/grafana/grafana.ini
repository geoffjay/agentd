; Grafana configuration template for agentd local observability stack.
;
; This is a template - infra/setup.sh copies it to
; ~/Library/Application Support/agentd/grafana/grafana.ini with the
; placeholder paths below resolved to their actual values.
;
; Do not edit the installed copy directly; edit this template and re-run setup.

[paths]
; Absolute path to the provisioning directory (datasources + dashboards)
provisioning = /Users/Shared/agentd/infra/grafana/provisioning

; Log directory
logs = /Users/Shared/agentd/logs

; SQLite database for Grafana state
data = /Users/Shared/agentd/grafana-data

[server]
; Default Grafana port - change if 3000 is in use
http_port = 3000
http_addr = 127.0.0.1

[security]
; Change admin_password before using in any non-local environment
admin_user = admin
admin_password = admin

[analytics]
reporting_enabled = false
check_for_updates = true

[log]
mode = file
level = info

[dashboards]
; Auto-reload provisioned dashboards when JSON files change
versions_to_keep = 20
