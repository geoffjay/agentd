name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.os }}

      - name: Build workspace
        run: cargo build --workspace

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: Run tests (Linux with coverage)
        if: matrix.os == 'ubuntu-latest'
        run: cargo tarpaulin --workspace --engine llvm --out Xml

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: ./cobertura.xml
          # Coverage upload is informational; a Codecov-side uploader/keyserver
          # issue must not fail CI when tests themselves pass.
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run tests (macOS)
        if: matrix.os == 'macos-latest'
        run: cargo test --workspace

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ui/coverage/lcov.info
          flags: frontend
          # Coverage upload is informational; a Codecov-side uploader/keyserver
          # issue must not fail CI when tests themselves pass.
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ matrix.os }}

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  docker-integration:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    # Only run when explicitly requested via the 'docker' PR label.
    # ubuntu-latest has Docker pre-installed with /var/run/docker.sock — no DinD needed.
    if: contains(github.event.pull_request.labels.*.name, 'docker')
    steps:
      - uses: actions/checkout@v6

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: docker-integration

      - name: Build agent image
        run: docker build -t agentd-claude:latest docker/claude-code/

      - name: Pull test image
        run: docker pull alpine:3.19

      - name: Run Docker integration tests (wrap)
        run: cargo test -p wrap -- --ignored --test-threads=1

      - name: Run Docker integration tests (orchestrator)
        run: cargo test -p orchestrator -- --ignored --test-threads=1

  pam-feature:
    name: PAM feature build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install protoc and libpam (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libpam0g-dev

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: pam-feature-${{ matrix.os }}

      # The `pam` feature links the system PAM library and builds on both
      # Linux (Linux-PAM) and macOS (OpenPAM). Build + clippy keep the
      # feature-gated code compiling on each. The verifier's runtime behavior
      # needs a live PAM stack and is exercised by the `--ignored` pam_smoke
      # tests (see docs/pam-authentication.md).
      - name: Build agentd-core with PAM
        run: cargo build -p agentd-core --features pam

      - name: Clippy agentd-core with PAM
        run: cargo clippy -p agentd-core --features pam --all-targets -- -D warnings

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run audit
        run: cargo audit --ignore RUSTSEC-2023-0071 # rsa via sqlx-mysql, no fix available
