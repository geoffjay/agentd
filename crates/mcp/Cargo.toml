[package]
name = "agentd-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "MCP server exposing agentd services as tools for Claude and other MCP clients"

[lib]
name = "agentd_mcp"
path = "src/lib.rs"

[[bin]]
name = "agentd-mcp"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# MCP server framework
rmcp = { version = "0.1", features = ["server", "macros", "transport-io"] }
schemars = "0.8"

# HTTP client for agentd services
reqwest = { version = "0.12", features = ["json"] }

# Async utilities for concurrent health checks
futures = "0.3"

# Date/time for remediation time-window filtering
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"
axum = { workspace = true }
tokio = { workspace = true, features = ["net"] }
