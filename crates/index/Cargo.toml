[package]
name = "index"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "index"
path = "src/lib.rs"

[[bin]]
name = "agentd-index"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# HTTP API server
axum = { workspace = true }
tower-http = { workspace = true, features = ["cors"] }

# Additional utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { workspace = true }
directories = "6.0.0"
agentd-common = { path = "../common" }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# Code parsing / chunking
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-swift = "0.7.1"
tree-sitter-zig = "1.1.2"
tree-sitter-go = "0.25"

# Vector storage (pin arrow versions to match lancedb 0.27)
lancedb = "0.27.1"
arrow-array = "57.2"
arrow-schema = "57.2"

# HTTP client for embedding API calls
reqwest = { workspace = true, features = ["json"] }

# Async traits and stream utilities
async-trait = "0.1"
futures = "0.3"

# Full-text keyword search (BM25) for hybrid search
tantivy = { version = "0.22", default-features = false, features = ["mmap"] }

# File hashing and directory walking
sha2 = "0.10"
ignore = "0.4"

# File-system change notifications (watcher)
notify = "6"

# OS-level resource limits (raising RLIMIT_NOFILE so Lance can mmap many files)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hyper = "1.0"
tempfile = "3.14"
