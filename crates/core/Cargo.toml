[package]
name = "agentd-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "agentd-core"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

axum = { workspace = true, features = ["ws"] }
tower-http = { workspace = true }
futures-util = "0.3"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }

uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { workspace = true }
agentd-common = { path = "../common" }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
async-trait = "0.1"
argon2 = "0.5"
rand = "0.8"
reqwest = { workspace = true, features = ["json", "stream"] }
clap = { workspace = true }

# PAM (system-user) authentication backend. Off by default; enabling it links
# system libpam (`libpam0g-dev` on Debian/Ubuntu, `pam-devel` on RHEL). Gated to
# Linux: `pam-client2`'s FFI assumes Linux-PAM's `const` message pointers and
# does not build against macOS PAM. macOS dev and CI build without the feature;
# even `--features pam` on macOS falls back to the fail-closed stub.
[target.'cfg(target_os = "linux")'.dependencies]
pam-client2 = { version = "0.5", optional = true }

[features]
# Enable PAM-based login (`auth_provider = 'pam'`).
pam = ["dep:pam-client2"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hyper = "1.0"
tempfile = "3.14"
notify = { path = "../notify" }
