# yaml-language-server: $schema=https://raw.githubusercontent.com/geoffjay/agentd/main/schemas/workflow.yml

# Merge worker workflow — dispatches merge automation to the conductor agent.
#
# Triggered when a pull request in geoffjay/agentd has the "merge-ready" label
# applied. The conductor verifies CI status, checks approvals, validates stack
# ordering, performs a squash merge, and restacks any dependent branches.
#
# Usage:
#   agent apply .agentd/workflows/merge-worker.yml
#   agent apply .agentd/  # creates all agents + workflows together

name: merge-worker
agent: conductor

source:
  type: github_pull_requests
  owner: geoffjay
  repo: agentd
  labels:
    - merge-ready
  state: open

poll_interval: 60
enabled: true

prompt_template: |
  A pull request has been labeled merge-ready and requires merge automation.

  PR #{{source_id}}: {{title}}
  URL: {{url}}
  Labels: {{labels}}

  Step 0 — Gather context from memory:
  Before starting, search shared memory for any recent merge decisions:
  1. agent memory search "merge queue conductor" --as-actor conductor --limit 3 --json
  2. Review results for known blockers or recent decisions.

  Step 1 — Session start: load current pipeline state (read-only).

  ```bash
  # Read-only overview — do NOT run git-spice repo sync here.
  # Syncing before CI/approval checks creates a pre-gate failure surface
  # (a lingering rebase conflict could abort the workflow before any checks run).
  # git-spice repo sync is scoped to Step 8, after a successful merge.
  git-spice log short
  ```

  Step 2 — Fetch full PR metadata.

  ```bash
  PR_DATA=$(gh pr view {{source_id}} --repo geoffjay/agentd \
    --json number,title,baseRefName,headRefName,labels,mergeable,\
  reviews,statusCheckRollup,url)
  echo "$PR_DATA" | jq '{
    number: .number,
    title: .title,
    base: .baseRefName,
    head: .headRefName,
    mergeable: .mergeable,
    labels: [.labels[].name],
    approved: ([.reviews[] | select(.state == "APPROVED")] | length),
    changes_requested: ([.reviews | group_by(.author.login)[]
                         | sort_by(.submittedAt) | last
                         | select(.state == "CHANGES_REQUESTED")] | length),
    ci_states: ([.statusCheckRollup[]?.state] | unique)
  }'
  ```

  Step 3 — Verify CI status.

  ```bash
  gh pr checks {{source_id}} --repo geoffjay/agentd

  CI_STATUS=$(gh pr view {{source_id}} --repo geoffjay/agentd \
    --json statusCheckRollup \
    --jq 'if [.statusCheckRollup[] | select(.state | IN("PENDING","IN_PROGRESS","QUEUED","EXPECTED"))] | length > 0
          then "PENDING"
          elif [.statusCheckRollup[] | select(.state | IN("FAILURE","ERROR","TIMED_OUT","CANCELLED","ACTION_REQUIRED"))] | length > 0
          then "FAILED"
          else "PASSED" end')
  echo "CI status: $CI_STATUS"
  ```

  - If `PENDING` → stop here, leave merge-ready intact, check again next run
  - If `FAILED` → remove merge-ready, comment on the PR, notify operations:

  ```bash
  gh pr edit {{source_id}} --repo geoffjay/agentd --remove-label "merge-ready"
  gh pr comment {{source_id}} --repo geoffjay/agentd \
    --body "❌ CI checks failed. Removed \`merge-ready\` label. Fix the failing checks and re-apply \`merge-ready\` to re-queue."
  agent communicate message send operations \
    "❌ PR #{{source_id}} ({{title}}) CI failed — removed merge-ready. Fix failing checks and re-apply merge-ready to re-queue."
  ```

  Stop this run.

  - If `PASSED` → continue

  Step 4 — Verify approval and no change requests.

  ```bash
  gh pr view {{source_id}} --repo geoffjay/agentd --json reviews \
    --jq '{
      approved: ([.reviews | group_by(.author.login)[]
                  | sort_by(.submittedAt) | last
                  | select(.state == "APPROVED")] | length),
      changes_requested: ([.reviews | group_by(.author.login)[]
                           | sort_by(.submittedAt) | last
                           | select(.state == "CHANGES_REQUESTED")] | length)
    }'
  ```

  - If `approved == 0` → stop; notify operations PR needs a review
  - If `changes_requested > 0` → remove merge-ready, add needs-rework, notify operations

  Step 5 — Verify no merge conflict.

  ```bash
  gh pr view {{source_id}} --repo geoffjay/agentd --json mergeable --jq '.mergeable'
  ```

  - `CONFLICTING` → add needs-restack, post to engineering, stop
  - `UNKNOWN` → defer to next run (GitHub still computing)
  - `MERGEABLE` → continue

  Step 6 — Verify stack prerequisites (if base is not a trunk branch).

  ```bash
  BASE=$(gh pr view {{source_id}} --repo geoffjay/agentd --json baseRefName --jq '.baseRefName')
  if [[ "$BASE" != "main" && "$BASE" != "feature/autonomous-pipeline" ]]; then
    # Check whether the base branch still exists remotely.
    # Output 0 → branch gone (merged/deleted), safe to proceed.
    # Output 1 → branch still open, parent PR must merge first.
    # Note: using git ls-remote rather than `gh pr list --state merged` because
    # the latter only finds bases that had a PR; a directly-pushed branch would
    # return empty and incorrectly block the merge.
    BASE_EXISTS=$(git ls-remote --heads origin "$BASE" | wc -l | tr -d ' ')
    echo "Base branch '$BASE' remote refs: $BASE_EXISTS"
    if [[ "$BASE_EXISTS" -gt 0 ]]; then
      echo "Base branch still open — merge the parent PR for '$BASE' first."
      agent communicate message send operations \
        "📚 PR #{{source_id}} ({{title}}) cannot merge yet — base branch '$BASE' is still open. Merge the parent PR first."
      # Stop this run; leave merge-ready intact for retry after parent merges.
    fi
  fi
  ```

  Step 7 — Perform the squash merge.

  ```bash
  TITLE=$(gh pr view {{source_id}} --repo geoffjay/agentd --json title --jq '.title')
  gh pr merge {{source_id}} --repo geoffjay/agentd \
    --squash --delete-branch --subject "$TITLE"

  # Verify
  gh pr view {{source_id}} --repo geoffjay/agentd --json state,mergedAt \
    --jq '{state: .state, mergedAt: .mergedAt}'
  ```

  Step 8 — Post-merge restack.

  ```bash
  git-spice repo sync

  # Resubmit only the branches stacked on top of the just-merged PR.
  # We check out the base of the merged PR first so that
  # `git-spice upstack submit` targets the correct upstack set.
  # NOTE: `git-spice stack submit` resubmits from the conductor's current
  # working-directory branch and may include branches beyond the direct
  # dependents of the just-merged PR. Use `upstack submit` from the merged
  # base to scope it correctly. When the conductor's full session context is
  # formalised this can be revisited.
  BASE=$(gh pr view {{source_id}} --repo geoffjay/agentd --json baseRefName --jq '.baseRefName')
  git checkout "$BASE"
  git-spice upstack submit --fill --no-prompt
  ```

  If `git-spice repo sync` fails with a conflict:
  - Abort: `git rebase --abort 2>/dev/null || true`
  - Identify the conflicting upstack branch with `git-spice log short`
  - Add `needs-restack` to the affected upstack PR
  - Post escalation to the engineering room (see conductor system prompt)

  Step 9 — Announce merge result.

  ```bash
  agent communicate message send operations \
    "✅ Merged PR #{{source_id}}: {{title}} (squash). Restacked dependents."
  ```

  Step 10 — Store merge decision in memory.

  ```bash
  agent memory remember "Merged PR #{{source_id}}: {{title}}. CI passed, approved, no conflicts." \
    --created-by conductor --type information \
    --tags conductor,merge,pr-{{source_id}} --visibility public
  ```
