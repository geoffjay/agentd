# yaml-language-server: $schema=https://raw.githubusercontent.com/geoffjay/agentd/main/schemas/workflow.yml

# Epic issue worker workflow — picks up epic issues and implements all
# sub-issues in dependency order using stacked branches.
#
# Usage:
#   agent apply .agentd/workflows/epic-issue-worker.yml
#   agent apply .agentd/  # creates all agents + workflows together

name: epic-issue-worker
agent: worker

source:
  type: github_issues
  owner: geoffjay
  repo: agentd
  labels:
    - epic-agent
  state: open

poll_interval: 120
enabled: true

prompt_template: |
  Work on the following epic issue by implementing all of its sub-issues
  in dependency order using stacked branches.

  Epic #{{source_id}}: {{title}}
  URL: {{url}}
  Labels: {{labels}}

  Description:
  {{body}}

  ## Step 0 — Gather context from memory

  Before starting implementation, search shared memory for relevant context:
  1. Search for memories related to this epic's topic:
     agent memory search "{{title}}" --as-actor worker --limit 5 --json
  2. Search for known decisions or gotchas in related areas:
     agent memory search "epic {{source_id}}" --as-actor worker --limit 3 --json
  3. Review results and factor relevant findings into your plan.

  ## Step 1 — Fetch sub-issues and build dependency graph

  Fetch all sub-issues of this epic using the GitHub GraphQL API:

  ```bash
  gh api graphql -f query='
  query($owner:String!, $repo:String!, $number:Int!) {
    repository(owner:$owner, name:$repo) {
      issue(number:$number) {
        subIssues(first:50) {
          nodes {
            number
            title
            state
            url
            blockedBy(first:20) {
              nodes { number title state }
            }
            blocking(first:20) {
              nodes { number title state }
            }
          }
          totalCount
        }
        subIssuesSummary { total completed percentCompleted }
      }
    }
  }' -f owner=geoffjay -f repo=agentd -F number={{source_id}}
  ```

  From the result:
  - Collect all sub-issues that are in `OPEN` state.
  - For each sub-issue, record which other sub-issues (within this epic) it
    is `blockedBy`.
  - Build a topological ordering: issues with no open blockers come first,
    then issues whose blockers all appear earlier in the list.
  - If the dependency graph has a cycle, stop and comment on the epic:
    `gh issue comment {{source_id}} --repo geoffjay/agentd --body "Dependency cycle detected among sub-issues: <details>. Cannot proceed."`

  ## Step 2 — Sync and create the epic root branch

  ```bash
  git-spice repo sync
  git checkout feature/autonomous-pipeline
  git pull origin feature/autonomous-pipeline
  git-spice branch create epic-{{source_id}} -m "epic: {{title}}"
  ```

  This creates an empty root branch for the epic. It will serve as the
  base for the first sub-issue and will accumulate all work via the stack.

  Submit a PR for the epic root branch against `main` immediately. This PR
  will contain no changes initially — it is the rollup PR for the entire epic:

  ```bash
  git-spice branch submit --no-prompt \
    --title "epic: {{title}} (#{{source_id}})" \
    --body "Rollup PR for epic #{{source_id}}.

  This branch collects all sub-issue work via stacked PRs.

  Sub-issues will be linked as they are implemented."
  ```

  ## Step 3 — Implement sub-issues in dependency order

  For each sub-issue in topological order, perform the following:

  ### 3a — Determine the stack base

  - If this is the **first** sub-issue (no blockers within the epic):
    the base is `epic-{{source_id}}` (the epic root branch).
  - If this sub-issue is **blocked by** another sub-issue in the epic:
    the base is the branch of the blocking sub-issue it depends on.
    When there are multiple blockers, use the one that appears latest in
    the topological order (it will already contain the transitive work).

  Check out the base branch before creating the new branch:

  ```bash
  git checkout <base-branch>
  git-spice branch create issue-<N> -m "feat: <brief description from sub-issue title>"
  ```

  ### 3b — Implement the sub-issue

  1. Read the sub-issue carefully:
     `gh issue view <N> --repo geoffjay/agentd`
  2. Plan your approach.
  3. Implement the change.
  4. Run relevant tests: `cargo test` (for Rust changes).
  5. Ensure `cargo fmt` and `cargo clippy` pass for Rust changes.
  6. Commit:
     ```bash
     git add <changed-files>
     git-spice commit create -m "feat(<scope>): <description>"
     ```

  ### 3c — Submit the sub-issue PR

  Submit a PR for this sub-issue branch with an explicit body so GitHub
  links the issue. git-spice automatically targets the correct base branch:

  ```bash
  git-spice branch submit --no-prompt --label review-agent \
    --title "feat: <brief description from sub-issue title>" \
    --body "<one-sentence summary of what was implemented>

  Closes #<N>"
  ```

  ### 3d — Move to the next sub-issue

  Repeat steps 3a-3c for the next sub-issue in the topological order.
  Each subsequent branch stacks on top of the previous one (or on its
  dependency's branch if the graph is not a simple chain).

  ## Step 4 — Final stack submission and cleanup

  After all sub-issues are implemented, verify the full stack:

  ```bash
  git-spice log short
  ```

  Confirm that the stack looks like:

  ```
  feature/autonomous-pipeline
    epic-{{source_id}}           → PR to main
      issue-<first>              → PR to epic-{{source_id}}
        issue-<second>           → PR to issue-<first>
          ...                    → PR to previous
  ```

  If any PRs were not submitted during the per-issue step (e.g. due to
  an error), submit each remaining branch individually with an explicit body:

  ```bash
  # For each unsubmitted branch (replace <N> with the sub-issue number):
  git checkout issue-<N>
  git-spice branch submit --no-prompt --label review-agent \
    --title "feat: <brief description>" \
    --body "<one-sentence summary>

  Closes #<N>"
  ```

  ## Step 5 — Store findings and close the epic

  Store any significant findings discovered during implementation:
  ```bash
  agent memory remember "<what you learned>" \
    --created-by worker --type information \
    --tags worker,epic-{{source_id}} --visibility public
  ```

  Comment on the epic with a summary of the work:
  ```bash
  gh issue comment {{source_id}} --repo geoffjay/agentd --body \
    "All sub-issues implemented and PRs submitted as a stacked branch chain.
     Stack root: epic-{{source_id}} → main
     Sub-issue PRs submitted with review-agent label."
  ```

  Do NOT close the epic issue — it remains open until all sub-issue PRs
  are merged. The conductor will close it during merge queue processing.

  ## Error Handling

  - If a sub-issue is unclear or too large, comment on it with questions
    and skip it. Continue with the next sub-issue that is not blocked by it.
  - If `cargo test`, `cargo fmt`, or `cargo clippy` fails, fix the issue
    before committing. If the failure is in unrelated code, note it in a
    comment on the sub-issue and proceed.
  - If a rebase conflict occurs during branch creation, follow the
    conflict resolution protocol from the git-spice skill.

  ## Handling needs-rework (reviewer requested changes)

  If re-dispatched because a sub-issue PR has the "needs-rework" label:
  1. Fetch the review comments for the flagged PR.
  2. Check out the sub-issue branch.
  3. Address the feedback.
  4. Amend and resubmit:
     ```bash
     git-spice commit amend -m "feat(<scope>): <description> (address review feedback)"
     git-spice branch submit --no-prompt --label review-agent \
       --title "feat: <description>" \
       --body "<summary of changes addressing review feedback>

     Closes #<N>"
     ```
  5. Restack any branches above:
     ```bash
     git-spice upstack restack
     ```
